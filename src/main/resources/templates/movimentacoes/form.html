<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Nova Movimentação | Sistema de Estoque</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:insert="~{fragments/header :: header}"></div>

<main class="senai-main">
    <section class="senai-hero">
        <div class="senai-shell" style="justify-content:center;">
            <div class="senai-card" style="width: 100%; max-width: 520px;">

                <h1 class="senai-title" style="font-size: 22px;">Nova Movimentação</h1>

                <div th:if="${erro}" class="senai-alert senai-alert-error">
                    <p th:text="${erro}"></p>
                </div>

                <form th:action="@{/movimentacoes/salvar}" method="post" class="senai-form">

                    <label class="senai-label">Material</label>
                    <select class="senai-input" name="materialId" required>
                        <option value="">Selecione o material</option>
                        <option th:each="mat : ${materiais}"
                                th:value="${mat.id}"
                                th:text="${mat.nome} + ' (Estoque: ' + ${mat.quantidade} + ')'">
                        </option>
                    </select>

                    <label class="senai-label">Tipo</label>
                    <select class="senai-input" name="tipo" required>
                        <option value="">Selecione o tipo</option>
                        <option value="ENTRADA">Entrada</option>
                        <option value="SAIDA">Saída</option>
                    </select>

                    <label class="senai-label">Quantidade</label>
                    <input class="senai-input" type="number" name="quantidade" min="1" required/>

                    <label class="senai-label">Observação</label>
                    <input class="senai-input" type="text" name="observacao" maxlength="255"/>

                    <button class="senai-button" type="submit" style="width:100%; margin-top:12px;">
                        Registrar
                    </button>
                </form>

                <a class="senai-link" th:href="@{/movimentacoes}" style="display:block; margin-top:12px;">
                    ← Voltar para Movimentações
                </a>
            </div>
        </div>
    </section>
</main>

<div th:insert="~{fragments/footer :: footer}"></div>
</body>
</html>
